name: Refresh IPTV playlist

on:
  schedule:
    # Daily at 12:00 UTC (~06:00 Calgary MDT / 05:00 MST)
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild all-channels.m3u
        run: python3 refresh.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain all-channels.m3u)" ]; then
            git add all-channels.m3u
            git commit -m "Auto-refresh playlist ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
